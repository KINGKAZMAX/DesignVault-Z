<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='8' fill='%23d7f446'/><text x='50' y='74' font-size='64' font-weight='900' text-anchor='middle' fill='%230a0a0a' font-family='Arial Black' transform='rotate(-4 50 50)'>Z</text></svg>">
<link rel="stylesheet" href="assets/style.css?v=6">
</head>
<body>

<header class="cover-banner" aria-hidden="true">
  <div class="big-type">DESIGN&nbsp;VAULT&nbsp;Z</div>
</header>

<div class="wrap">
  <div class="page-head">
    <div class="page-icon"><span>Z</span></div>
    <h1>设计资源库</h1>
  </div>

  <div class="intro">
    <div class="row">悄悄说明：这是精心整理的设计资源收藏库，长期更新。</div>
    <div class="row">版权声明：本站仅收录资源链接与名称，版权归原作者所有；商用请前往原地址甄别授权。</div>
    <div class="row">交流合作：欢迎通过 GitHub 提交资源补充与勘误。</div>
  </div>

  <nav class="toolbar">
    <div class="chips" id="chips"></div>
    <div class="search">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="searchInput" type="text" placeholder="搜索资源…" autocomplete="off">
    </div>
  </nav>

  <main>
    <div class="section-head">
      <h2 id="sectionTitle">全部</h2>
      <span class="section-count" id="sectionCount"></span>
    </div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" hidden>
      <div class="empty-icon">🔍</div>
      <p>没有找到匹配的资源，换个关键词试试～</p>
    </div>
  </main>
</div>

<button id="backTop" title="回到顶部" aria-label="回到顶部">↑</button>

<footer>
  <p>🗂️ <b>设计资源库 Z</b> — 收藏即用，长期维护 · 本站仅收录资源链接，各资源版权归原作者所有，商用前请自行确认授权。</p>
  <p class="foot-links">
    <a href="https://github.com/KINGKAZMAX/DesignVault-Z" target="_blank" rel="noopener">GitHub</a>
    <span>·</span>
    <span>灵感整理参考自设计师社区的公开分享</span>
  </p>
</footer>

<script src="assets/data.js?v=6"></script>
